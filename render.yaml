services:
  - type: web
    name: ecopulse-backend
    env: python
    region: singapore
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATA_PROVIDER
        value: simulator
      - key: CORS_ORIGINS
        value: "*"
